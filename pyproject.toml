[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flitflow"
version = "1.1.1"
description = "A lightweight, safe, and portable execution engine DSL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "jsonschema>=4.0.0",
    "json5>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flitflow"]
